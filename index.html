<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máxima Machado - Promotora Zermat</title>
    <!-- Íconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('fondo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            /* Ubicado estratégicamente en el espacio central libre */
            margin-top: 10px; 
            margin-bottom: 220px; 
            padding: 24px 20px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(106, 27, 154, 0.15);
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(74, 20, 140, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .btn-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 22px rgba(74, 20, 140, 0.4);
        }

        .btn-link i {
            font-size: 1.3rem;
        }

        /* Estilos de botones combinados con el fondo */
        .facebook {
            background: linear-gradient(135deg, #6a1b9a, #4a148c); /* Morado oscuro elegante */
        }

        .claro {
            background: linear-gradient(135deg, #8e24aa, #ab47bc); /* Lila / Violeta vibrante */
        }

        .tigo {
            background: linear-gradient(135deg, #b8860b, #d4af37); /* Dorado/Champán haciendo juego con las botellas */
            color: #2a1b08;
            text-shadow: none;
            box-shadow: 0 4px 15px rgba(184, 134, 11, 0.3);
        }

        .tigo:hover {
            box-shadow: 0 6px 22px rgba(184, 134, 11, 0.45);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Facebook -->
        <a href="https://www.facebook.com/share/1Ja51hjaDt/" target="_blank" class="btn-link facebook">
            <i class="fa-brands fa-facebook-f"></i>
            <span>Página de Facebook</span>
        </a>

        <!-- WhatsApp / Llamada Claro -->
        <a href="https://wa.me/50589228328" target="_blank" class="btn-link claro">
            <i class="fa-brands fa-whatsapp"></i>
            <span>WhatsApp Claro: +505 8922 8328</span>
        </a>

        <!-- WhatsApp / Llamada Tigo -->
        <a href="https://wa.me/50582445184" target="_blank" class="btn-link tigo">
            <i class="fa-brands fa-whatsapp"></i>
            <span>WhatsApp Tigo: 8244 5184</span>
        </a>
    </div>

</body>
</html>
